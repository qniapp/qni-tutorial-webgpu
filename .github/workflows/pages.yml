name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main, feat/restart-in-status-bar, feat/pinned-embed-t2]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install tutorial dependencies
        run: pnpm install --frozen-lockfile
      - name: Test pinned embed release verification
        run: pnpm run test:unit
      - name: Build Astro and upload Pages artifact
        uses: withastro/action@v6
        # gh is preinstalled; public release verification needs no write permission.
        # Pass its token only to builds that fetch the pinned release.
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          node-version: 24
          build-cmd: pnpm run typecheck && pnpm run build
      # Exercise the same attested release in an isolated acceptance build.
      - name: Install mobile acceptance Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run isolated pinned embed mobile acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-pinned-embed-mobile.mjs
      - name: Upload mobile acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-embed-mobile-results
          path: test-results/pinned-embed-mobile
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload built site for Playwright
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Run Playwright
        run: pnpm exec playwright test --workers=1
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
